<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <title>ARGOS — 로그인</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/img/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/img/icons/icon-192.png">
  <link rel="stylesheet" href="/static/css/argos.css?v={{ asset_v | default('dev') }}">
  <style>
    .login { max-width: 22rem; margin: 18vh auto 0; padding: 0 1rem; }
    .login h1 { font-size: 1.25rem; margin: 0 0 .5rem; letter-spacing: .08em; }
    .login p { margin: 0 0 1rem; opacity: .75; line-height: 1.5; font-size: .9rem; }
    .login input[type=password] { width: 100%; box-sizing: border-box; padding: .7rem .8rem;
      font: inherit; border-radius: .5rem; border: 1px solid currentColor; background: transparent; color: inherit; }
    .login button { margin-top: .75rem; width: 100%; padding: .7rem; font: inherit; border-radius: .5rem;
      border: 0; cursor: pointer; }
    .login .login-error { color: #d0563b; opacity: 1; }
    .login code { font-size: .85em; }
  </style>
</head>
<body>
  <main class="login">
    <h1>ARGOS</h1>
    <p>이 기기에서 처음 열었습니다. Mac 터미널에서 <code>argos web token</code>을 실행해 나온 토큰을 붙여 넣으세요. 한 번 로그인하면 이 기기에서는 다시 묻지 않습니다.</p>
    {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next_path }}">
      <label for="token" class="visually-hidden">토큰</label>
      <input id="token" name="token" type="password" autocomplete="current-password"
             autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus
             placeholder="웹 토큰">
      <button type="submit">로그인</button>
    </form>
  </main>
</body>
</html>
